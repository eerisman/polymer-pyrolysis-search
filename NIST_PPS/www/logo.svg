<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 150" width="540" height="150">
  <!-- Rounded White Card Background -->
  <rect x="0" y="0" width="540" height="150" rx="8" ry="8" fill="#ffffff"/>

  <!-- NIST Main Wordmark -->
  <text x="18" y="68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-weight="900" font-size="64" fill="#000000" letter-spacing="-1.5">NIST</text>

  <!-- NIST Subtext -->
  <text x="20" y="88" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-weight="bold" font-size="14" fill="#000000">National Institute of</text>
  <text x="20" y="106" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-weight="bold" font-size="14" fill="#000000">Standards and Technology</text>
  <text x="20" y="124" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-weight="normal" font-size="11.5" fill="#222222">U.S. Department of Commerce</text>

  <!-- Vertical Divider Line -->
  <line x1="228" y1="18" x2="228" y2="132" stroke="#111111" stroke-width="2"/>

  <!-- Mass Spec Peaks Diagram -->
  <g stroke="#D02020" stroke-width="2.2" stroke-linecap="round">
    <!-- Baseline -->
    <line x1="244" y1="58" x2="518" y2="58"/>

    <!-- Peaks -->
    <line x1="258" y1="58" x2="258" y2="48"/>
    <line x1="280" y1="58" x2="280" y2="38"/>
    <line x1="300" y1="58" x2="300" y2="20"/> <!-- Base Peak -->
    <line x1="320" y1="58" x2="320" y2="42"/>
    <line x1="340" y1="58" x2="340" y2="50"/>
    <line x1="365" y1="58" x2="365" y2="28"/>
    <line x1="390" y1="58" x2="390" y2="44"/>
    <line x1="418" y1="58" x2="418" y2="16"/> <!-- High m/z Peak -->
    <line x1="445" y1="58" x2="445" y2="40"/>
    <line x1="475" y1="58" x2="475" y2="48"/>
    <line x1="500" y1="58" x2="500" y2="32"/>
  </g>

  <!-- Blue Mass Spectrometry Data Center Text -->
  <text x="244" y="88" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-weight="bold" font-size="20" fill="#0044A9">Mass Spectrometry</text>
  <text x="244" y="114" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-weight="bold" font-size="20" fill="#0044A9">Data Center</text>
</svg>
